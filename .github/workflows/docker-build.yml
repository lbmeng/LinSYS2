name: Docker Build

on:
  push:
    branches: [main, master]
    paths:
      - 'Dockerfile'
      - 'Makefile'
      - 'scripts/**'
      - 'patches/**'
      - 'vendor/msys2-pacman/**'
      - 'vendor/msys2-keyring/**'
      - '.gitmodules'
      - '.github/workflows/docker-build.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'Dockerfile'
      - 'Makefile'
      - 'scripts/**'
      - 'patches/**'
      - 'vendor/msys2-pacman/**'
      - 'vendor/msys2-keyring/**'
      - '.gitmodules'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Docker image
        run: docker build -t linsys2:latest .
